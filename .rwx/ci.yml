on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      deploy: false
  github:
    pull_request:
      status-checks:
        name: Library
      init:
        commit-sha: ${{ event.git.sha }}
        deploy: false
    push:
      if: ${{ event.git.ref == 'refs/heads/main' }}
      init:
        commit-sha: ${{ event.git.sha }}
        deploy: true

concurrency-pools:
  - id: ajorgensen/library:production
    if: ${{ init.deploy }}
    capacity: 1
    on-overflow: cancel-waiting

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.4.0
    with:
      repository: https://github.com/ajorgensen/ourlibrary.git
      ref: ${{ init.commit-sha }}

  - key: test
    use: code
    docker: preserve-data
    run: docker build --platform linux/amd64 --target test .

  - key: image
    use: test
    docker: preserve-data
    env:
      COMMIT_SHA: ${{ init.commit-sha }}
    run: >-
      docker build --platform linux/amd64
      -t "ghcr.io/ajorgensen/ourlibrary:$COMMIT_SHA"
      -t ghcr.io/ajorgensen/ourlibrary:latest .

  - key: ghcr-login
    call: docker/login-hook 1.1.0
    if: ${{ init.deploy }}
    with:
      registry: ghcr.io
      username: ${{ vaults.library-production.secrets.GHCR_USERNAME }}

  - key: publish
    use: [image, ghcr-login]
    if: ${{ init.deploy }}
    cache: false
    docker: preserve-data
    env:
      COMMIT_SHA: ${{ init.commit-sha }}
      DOCKER_PASSWORD: ${{ vaults.library-production.secrets.GHCR_TOKEN }}
    run: |
      docker push "ghcr.io/ajorgensen/ourlibrary:$COMMIT_SHA"
      docker push ghcr.io/ajorgensen/ourlibrary:latest

  - key: deploy
    use: code
    after: publish
    if: ${{ init.deploy }}
    cache: false
    env:
      COMMIT_SHA: ${{ init.commit-sha }}
      SSH_PRIVATE_KEY: ${{ vaults.library-production.secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ vaults.library-production.vars.SSH_HOST }}
      SSH_KNOWN_HOSTS: ${{ vaults.library-production.vars.SSH_KNOWN_HOSTS }}
    run: bash scripts/deploy
