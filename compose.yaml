services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ourlibrary
      POSTGRES_USER: ourlibrary
      POSTGRES_PASSWORD: ourlibrary
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourlibrary -d ourlibrary"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
